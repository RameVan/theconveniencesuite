<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><!-- SDU-15 smart fuse board, stylised: two rows of blade fuses, a sense chip and LED per channel, ESP32 module, screw terminals -->
  <defs>
    <g id="fuse">
      <rect x="-15" y="0" width="30" height="34" rx="4"/>
      <rect x="-10" y="5" width="20" height="9" rx="2" fill="#0b0b0b" opacity=".22"/>
      <path d="M-9 34v10M9 34v10" stroke="#d9d1c2" stroke-width="4" stroke-linecap="square"/>
    </g>
    <g id="sense">
      <rect x="-9" y="0" width="18" height="12" rx="1.5" fill="#2a2926" stroke="#6b675f" stroke-width="1.2"/>
      <circle cx="0" cy="22" r="3.5" fill="#6a994e"/>
    </g>
    <g id="term">
      <circle r="10" fill="#bfb6a6"/>
      <path d="M-5 0h10M0-5v10" stroke="#6b675f" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>
  <clipPath id="frame"><rect width="640" height="400" rx="28"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="640" height="400" fill="#0b0b0b"/>
    <rect x="576" width="16" height="400" fill="#f6b73c"/><rect x="592" width="16" height="400" fill="#f08a2c"/><rect x="608" width="16" height="400" fill="#e4502b"/><rect x="624" width="16" height="400" fill="#b32620"/>
  </g>
  <!-- board -->
  <rect x="34" y="40" width="514" height="320" rx="14" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
  <g fill="none" stroke="#f4f1ea" stroke-opacity=".12" stroke-width="3" stroke-linecap="round">
    <path d="M60 128H520M60 252H520"/>
    <path d="M86 148v14M136 148v14M186 148v14M236 148v14M286 148v14M336 148v14M386 148v14M436 148v14"/>
    <path d="M86 272v14M136 272v14M186 272v14M236 272v14M286 272v14M336 272v14M386 272v14"/>
  </g>
  <g fill="#e8e1d4">
    <circle cx="50" cy="56" r="5"/><circle cx="532" cy="56" r="5"/><circle cx="50" cy="344" r="5"/><circle cx="532" cy="344" r="5"/>
  </g>
  <!-- row A: 8 channels -->
  <g>
    <use href="#fuse" x="86" y="66" fill="#f6b73c"/><use href="#fuse" x="136" y="66" fill="#f08a2c"/>
    <use href="#fuse" x="186" y="66" fill="#f08a2c"/><use href="#fuse" x="236" y="66" fill="#e4502b"/>
    <use href="#fuse" x="286" y="66" fill="#e4502b"/><use href="#fuse" x="336" y="66" fill="#f6b73c"/>
    <use href="#fuse" x="386" y="66" fill="#b32620"/><use href="#fuse" x="436" y="66" fill="#f08a2c"/>
    <use href="#sense" x="86" y="138"/><use href="#sense" x="136" y="138"/><use href="#sense" x="186" y="138"/><use href="#sense" x="236" y="138"/>
    <use href="#sense" x="286" y="138"/><use href="#sense" x="336" y="138"/><use href="#sense" x="386" y="138"/><use href="#sense" x="436" y="138"/>
  </g>
  <!-- row B: 7 channels -->
  <g>
    <use href="#fuse" x="86" y="190" fill="#e4502b"/><use href="#fuse" x="136" y="190" fill="#f6b73c"/>
    <use href="#fuse" x="186" y="190" fill="#f6b73c"/><use href="#fuse" x="236" y="190" fill="#b32620"/>
    <use href="#fuse" x="286" y="190" fill="#f08a2c"/><use href="#fuse" x="336" y="190" fill="#e4502b"/>
    <use href="#fuse" x="386" y="190" fill="#f6b73c"/>
    <use href="#sense" x="86" y="262"/><use href="#sense" x="136" y="262"/><use href="#sense" x="186" y="262"/><use href="#sense" x="236" y="262"/>
    <use href="#sense" x="286" y="262"/><use href="#sense" x="336" y="262"/><use href="#sense" x="386" y="262"/>
  </g>
  <!-- ESP32 module -->
  <rect x="440" y="190" width="84" height="92" rx="4" fill="#2a2926" stroke="#bfb6a6" stroke-width="2"/>
  <rect x="452" y="214" width="60" height="56" rx="2" fill="#bfb6a6" opacity=".9"/>
  <path d="M452 202h8v-6h8v6h8v-6h8v6h8v-6h8v6h4" fill="none" stroke="#f6b73c" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- feed stud -->
  <rect x="490" y="70" width="40" height="70" rx="6" fill="#2a2926" stroke="#bfb6a6" stroke-width="2"/>
  <circle cx="510" cy="92" r="11" fill="#e8e1d4"/><circle cx="510" cy="92" r="4" fill="#6b675f"/>
  <path d="M498 122h24M498 130h24" stroke="#f4f1ea" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <!-- output terminals -->
  <g>
    <use href="#term" x="86" y="326"/><use href="#term" x="113" y="326"/><use href="#term" x="140" y="326"/><use href="#term" x="167" y="326"/>
    <use href="#term" x="194" y="326"/><use href="#term" x="221" y="326"/><use href="#term" x="248" y="326"/><use href="#term" x="275" y="326"/>
    <use href="#term" x="302" y="326"/><use href="#term" x="329" y="326"/><use href="#term" x="356" y="326"/><use href="#term" x="383" y="326"/>
    <use href="#term" x="410" y="326"/><use href="#term" x="437" y="326"/><use href="#term" x="464" y="326"/>
  </g>
  <text x="482" y="304" font-family="Georgia, serif" font-size="13" fill="#f4f1ea" opacity=".6" text-anchor="middle" letter-spacing="1">REV A</text>
</svg>
