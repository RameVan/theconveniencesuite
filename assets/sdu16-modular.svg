<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><!-- TwelveVolt Modular (SDU-16), stylised: two 8-slot distribution boards, a controller board and the high-current module, linked by dashed cables -->
  <defs>
    <g id="mfuse">
      <rect x="-11" y="0" width="22" height="26" rx="3"/>
      <rect x="-7" y="4" width="14" height="7" rx="1.5" fill="#0b0b0b" opacity=".22"/>
      <path d="M-6 26v7M6 26v7" stroke="#d9d1c2" stroke-width="3" stroke-linecap="square"/>
    </g>
    <g id="msense">
      <rect x="-7" y="0" width="14" height="9" rx="1.2" fill="#2a2926" stroke="#6b675f" stroke-width="1"/>
      <circle cx="0" cy="16" r="2.6" fill="#6a994e"/>
    </g>
    <g id="mega">
      <rect x="-30" y="-13" width="60" height="26" rx="4" fill="#2a2926" stroke="#bfb6a6" stroke-width="2"/>
      <rect x="-16" y="-8" width="32" height="16" rx="2"/>
      <circle cx="-23" r="4" fill="#e8e1d4"/><circle cx="23" r="4" fill="#e8e1d4"/>
    </g>
  </defs>
  <clipPath id="frame"><rect width="640" height="400" rx="28"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="640" height="400" fill="#0b0b0b"/>
    <rect x="576" width="16" height="400" fill="#f6b73c"/><rect x="592" width="16" height="400" fill="#f08a2c"/><rect x="608" width="16" height="400" fill="#e4502b"/><rect x="624" width="16" height="400" fill="#b32620"/>
  </g>
  <!-- cables between modules -->
  <g fill="none" stroke="#f4f1ea" stroke-opacity=".4" stroke-width="2.4" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M392 92H424M392 192H408V120H424"/>
    <path d="M120 236V262M300 136V146M300 236V262"/>
  </g>
  <!-- DB-A -->
  <g>
    <rect x="34" y="40" width="358" height="96" rx="10" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
    <use href="#mfuse" x="72" y="54" fill="#f6b73c"/><use href="#mfuse" x="112" y="54" fill="#f08a2c"/><use href="#mfuse" x="152" y="54" fill="#f08a2c"/><use href="#mfuse" x="192" y="54" fill="#e4502b"/>
    <use href="#mfuse" x="232" y="54" fill="#e4502b"/><use href="#mfuse" x="272" y="54" fill="#f6b73c"/><use href="#mfuse" x="312" y="54" fill="#b32620"/><use href="#mfuse" x="352" y="54" fill="#f08a2c"/>
    <use href="#msense" x="72" y="96"/><use href="#msense" x="112" y="96"/><use href="#msense" x="152" y="96"/><use href="#msense" x="192" y="96"/>
    <use href="#msense" x="232" y="96"/><use href="#msense" x="272" y="96"/><use href="#msense" x="312" y="96"/><use href="#msense" x="352" y="96"/>
  </g>
  <!-- DB-B, last slot is the spare -->
  <g>
    <rect x="34" y="146" width="358" height="96" rx="10" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
    <use href="#mfuse" x="72" y="160" fill="#e4502b"/><use href="#mfuse" x="112" y="160" fill="#f6b73c"/><use href="#mfuse" x="152" y="160" fill="#f6b73c"/><use href="#mfuse" x="192" y="160" fill="#b32620"/>
    <use href="#mfuse" x="232" y="160" fill="#f08a2c"/><use href="#mfuse" x="272" y="160" fill="#e4502b"/><use href="#mfuse" x="312" y="160" fill="#f6b73c"/>
    <rect x="341" y="160" width="22" height="26" rx="3" fill="none" stroke="#6b675f" stroke-width="2" stroke-dasharray="4 3"/>
    <use href="#msense" x="72" y="202"/><use href="#msense" x="112" y="202"/><use href="#msense" x="152" y="202"/><use href="#msense" x="192" y="202"/>
    <use href="#msense" x="232" y="202"/><use href="#msense" x="272" y="202"/><use href="#msense" x="312" y="202"/><use href="#msense" x="352" y="202"/>
  </g>
  <!-- controller -->
  <g>
    <rect x="424" y="40" width="124" height="128" rx="10" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
    <rect x="444" y="60" width="84" height="74" rx="4" fill="#2a2926" stroke="#bfb6a6" stroke-width="2"/>
    <rect x="456" y="82" width="60" height="42" rx="2" fill="#bfb6a6" opacity=".9"/>
    <path d="M456 72h8v-6h8v6h8v-6h8v6h8v-6h8v6h4" fill="none" stroke="#f6b73c" stroke-width="2.4" stroke-linejoin="round"/>
    <g fill="#6a994e"><circle cx="450" cy="152" r="3"/><circle cx="462" cy="152" r="3"/></g>
    <path d="M486 152h48" stroke="#bfb6a6" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 7"/>
  </g>
  <!-- high-current module: MEGA bus, three 80 A fuses, busbar shunt and battery protect -->
  <g>
    <rect x="34" y="262" width="514" height="98" rx="10" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
    <rect x="54" y="280" width="16" height="62" rx="3" fill="#bfb6a6"/>
    <path d="M70 311H96" stroke="#bfb6a6" stroke-width="8"/>
    <rect x="96" y="276" width="10" height="70" rx="2" fill="#e8e1d4"/>
    <use href="#mega" x="146" y="294" fill="#e4502b"/>
    <use href="#mega" x="146" y="328" fill="#e4502b"/>
    <use href="#mega" x="236" y="294" fill="#e4502b"/>
    <path d="M106 294H116M106 328H116M176 294H206" stroke="#e8e1d4" stroke-width="5"/>
    <path d="M266 294H316" stroke="#e8e1d4" stroke-width="5"/>
    <rect x="316" y="282" width="62" height="24" rx="2" fill="#d9d1c2"/>
    <rect x="334" y="274" width="26" height="14" rx="2" fill="#2a2926" stroke="#6a994e" stroke-width="1.6"/>
    <path d="M378 294H404" stroke="#e8e1d4" stroke-width="5"/>
    <rect x="404" y="276" width="118" height="68" rx="8" fill="#2a2926" stroke="#bfb6a6" stroke-width="2"/>
    <rect x="420" y="290" width="44" height="12" rx="2" fill="#f6b73c"/>
    <path d="M420 320h86M420 330h60" stroke="#f4f1ea" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="486" y="208" font-family="Georgia, serif" font-size="13" fill="#f4f1ea" opacity=".6" text-anchor="middle" letter-spacing="1">PARKED</text>
</svg>
