<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><!-- TwelveVolt FuseBox, stylised: a 12-way blade fuse box with a 6-channel comb board on each side. Each finger lies on a fuse terminal; each board has a switch, sense chip, LED and lever clamp per channel and its own ESP32 module -->
  <defs>
    <g id="fuse">
      <rect x="-12" y="0" width="24" height="30" rx="3"/>
      <rect x="-8" y="4" width="16" height="8" rx="2" fill="#0b0b0b" opacity=".22"/>
    </g>
    <!-- one channel on a board, drawn for the top board (clamp at the outer edge, finger towards the box) -->
    <g id="ch">
      <rect x="-12" y="86" width="24" height="60" fill="#1b1a18"/>
      <path d="M-12 86v60M12 86v60" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
      <circle cy="136" r="7" fill="#f6b73c"/><circle cy="136" r="3" fill="#1b1a18"/>
      <rect x="-15" y="12" width="30" height="20" rx="2" fill="#f08a2c"/>
      <rect x="-15" y="12" width="12" height="20" rx="2" fill="#f6b73c"/>
      <rect x="-11" y="44" width="22" height="18" rx="1.5" fill="#2a2926" stroke="#6b675f" stroke-width="1.2"/>
      <rect x="-6" y="70" width="12" height="8" rx="1" fill="#2a2926" stroke="#6b675f" stroke-width="1"/>
      <circle cx="18" cy="74" r="3.2" fill="#6a994e"/>
    </g>
    <g id="esp">
      <rect x="0" y="0" width="70" height="58" rx="3" fill="#2a2926" stroke="#6a994e" stroke-width="2"/>
      <rect x="8" y="8" width="54" height="34" rx="2" fill="#bfb6a6" opacity=".55"/>
      <circle cx="14" cy="50" r="4" fill="#f6b73c"/>
    </g>
  </defs>
  <clipPath id="frame"><rect width="640" height="400" rx="28"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="640" height="400" fill="#0b0b0b"/>
    <rect x="576" width="16" height="400" fill="#f6b73c"/><rect x="592" width="16" height="400" fill="#f08a2c"/><rect x="608" width="16" height="400" fill="#e4502b"/><rect x="624" width="16" height="400" fill="#b32620"/>
  </g>

  <!-- fuse box -->
  <rect x="58" y="148" width="352" height="104" rx="10" fill="#2a2926" stroke="#f4f1ea" stroke-opacity=".4" stroke-width="2"/>
  <g fill="#f4f1ea" opacity=".08"><rect x="128" y="152" width="4" height="96"/><rect x="184" y="152" width="4" height="96"/><rect x="240" y="152" width="4" height="96"/><rect x="296" y="152" width="4" height="96"/><rect x="352" y="152" width="4" height="96"/></g>
  <g fill="#f6b73c"><use href="#fuse" x="100" y="170"/><use href="#fuse" x="268" y="170"/></g>
  <g fill="#f08a2c"><use href="#fuse" x="156" y="170"/><use href="#fuse" x="324" y="170"/></g>
  <g fill="#e4502b"><use href="#fuse" x="212" y="170"/><use href="#fuse" x="380" y="170" fill="#b32620"/></g>
  <g fill="#e4502b"><use href="#fuse" x="100" y="202"/><use href="#fuse" x="268" y="202"/></g>
  <g fill="#f6b73c"><use href="#fuse" x="156" y="202"/><use href="#fuse" x="324" y="202"/></g>
  <g fill="#b32620"><use href="#fuse" x="212" y="202"/><use href="#fuse" x="380" y="202" fill="#f08a2c"/></g>
  <!-- + feed stud and - bus -->
  <circle cx="38" cy="200" r="13" fill="#bfb6a6"/><path d="M32 200h12M38 194v12" stroke="#6b675f" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M51 200h7" stroke="#bfb6a6" stroke-width="4"/>

  <!-- top board (left column) -->
  <rect x="70" y="24" width="440" height="88" rx="8" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
  <g fill="none" stroke="#f4f1ea" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"><path d="M100 102H430"/></g>
  <use href="#ch" x="100" y="14"/><use href="#ch" x="156" y="14"/><use href="#ch" x="212" y="14"/><use href="#ch" x="268" y="14"/><use href="#ch" x="324" y="14"/><use href="#ch" x="380" y="14"/>
  <use href="#esp" x="428" y="38"/>

  <!-- bottom board (right column): the same board turned 180 degrees -->
  <g transform="rotate(180 290 200)">
    <rect x="70" y="24" width="440" height="88" rx="8" fill="#1b1a18" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="2"/>
    <g fill="none" stroke="#f4f1ea" stroke-opacity=".12" stroke-width="3" stroke-linecap="round"><path d="M100 102H430"/></g>
    <use href="#ch" x="200" y="14"/><use href="#ch" x="256" y="14"/><use href="#ch" x="312" y="14"/><use href="#ch" x="368" y="14"/><use href="#ch" x="424" y="14"/><use href="#ch" x="480" y="14"/>
    <use href="#esp" x="88" y="38"/>
  </g>
</svg>
