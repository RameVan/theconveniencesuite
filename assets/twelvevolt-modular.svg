<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><!-- TwelveVolt Modular Rev A row, stylised front view after TVM_revA_views: row head (76 mm), SM (36), M (36), M+ (54); 2 px = 1 mm -->
  <defs>
    <g id="ear"><rect x="-9" y="-11" width="18" height="16" rx="3" fill="#d9d1c2"/><rect x="-4" y="-7" width="8" height="8" rx="2" fill="#0b0b0b"/></g>
    <g id="cap"><rect x="-14" y="0" width="28" height="44" rx="4" fill="#2a2926"/><rect x="-10" y="34" width="20" height="6" rx="2" fill="#6b675f"/></g>
    <g id="vents" stroke="#bfb6a6" stroke-width="3" stroke-linecap="round"><path d="M0 0v34M9 0v34M18 0v34M27 0v34M36 0v34M45 0v34M54 0v34M63 0v34"/></g>
  </defs>
  <clipPath id="frame"><rect width="640" height="400" rx="28"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="640" height="400" fill="#0b0b0b"/>
    <rect x="576" width="16" height="400" fill="#f6b73c"/><rect x="592" width="16" height="400" fill="#f08a2c"/><rect x="608" width="16" height="400" fill="#e4502b"/><rect x="624" width="16" height="400" fill="#b32620"/>
  </g>

  <!-- screw ears: top left and bottom right of every housing -->
  <use href="#ear" x="104" y="36"/><use href="#ear" x="250" y="36"/><use href="#ear" x="322" y="36"/><use href="#ear" x="394" y="36"/>
  <use href="#ear" x="224" y="360"/><use href="#ear" x="296" y="360"/>
  <use href="#ear" x="368" y="360"/><use href="#ear" x="478" y="360"/>

  <!-- housings -->
  <g fill="#f4f1ea" stroke="#bfb6a6" stroke-width="2">
    <rect x="86" y="40" width="152" height="312" rx="6"/>
    <rect x="238" y="40" width="72" height="312" rx="4"/>
    <rect x="310" y="40" width="72" height="312" rx="4"/>
    <rect x="382" y="40" width="108" height="312" rx="4"/>
  </g>

  <!-- row head: feed cap, vents, logo, GND cap -->
  <use href="#cap" x="108" y="54"/>
  <use href="#vents" x="146" y="70"/>
  <use href="#vents" x="140" y="262"/>
  <g transform="translate(176 196)">
    <circle r="27" fill="#0b0b0b"/>
    <clipPath id="logo"><circle r="24"/></clipPath>
    <g clip-path="url(#logo)">
      <rect x="-24" y="-24" width="48" height="22" fill="#f6b73c"/>
      <rect x="-24" y="-12" width="48" height="6" fill="#f08a2c"/><rect x="-24" y="-6" width="48" height="6" fill="#e4502b"/>
      <path d="M-26 24-6-4 4 8 12-2 28 24Z" fill="#f4f1ea"/>
      <path d="M-26 24-6-4 4 8 12-2 28 24" fill="none" stroke="#0b0b0b" stroke-width="3"/>
    </g>
  </g>
  <text x="176" y="246" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#0b0b0b" text-anchor="middle">TwelveVolt</text>
  <use href="#cap" x="214" y="296"/>

  <!-- TwelveVolt SM: fuses above and below the type plate -->
  <use href="#cap" x="274" y="54"/>
  <rect x="263" y="146" width="22" height="34" rx="3" fill="#f08a2c" stroke="#0b0b0b" stroke-width="3"/>
  <rect x="246" y="186" width="56" height="26" rx="3" fill="none" stroke="#f08a2c" stroke-width="3"/>
  <text x="274" y="205" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#0b0b0b" text-anchor="middle">SM</text>
  <rect x="263" y="218" width="22" height="34" rx="3" fill="#e4502b" stroke="#0b0b0b" stroke-width="3"/>
  <use href="#cap" x="274" y="294"/>

  <!-- TwelveVolt M -->
  <use href="#cap" x="346" y="54"/>
  <rect x="335" y="146" width="22" height="34" rx="3" fill="#f6b73c" stroke="#0b0b0b" stroke-width="3"/>
  <rect x="320" y="186" width="52" height="26" rx="13" fill="none" stroke="#6a994e" stroke-width="3"/>
  <text x="346" y="205" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#0b0b0b" text-anchor="middle">M</text>
  <rect x="335" y="218" width="22" height="34" rx="3" fill="#f6b73c" stroke="#0b0b0b" stroke-width="3"/>
  <use href="#cap" x="346" y="294"/>

  <!-- TwelveVolt M+ 80 A: bolted studs top and bottom -->
  <rect x="420" y="50" width="34" height="96" rx="5" fill="#2a2926"/>
  <circle cx="437" cy="128" r="9" fill="#bfb6a6"/><circle cx="437" cy="128" r="4" fill="#2a2926"/>
  <rect x="392" y="186" width="90" height="26" rx="13" fill="none" stroke="#6a994e" stroke-width="3"/>
  <text x="437" y="205" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#0b0b0b" text-anchor="middle">M+ 80 A</text>
  <rect x="420" y="246" width="34" height="96" rx="5" fill="#2a2926"/>
  <circle cx="437" cy="264" r="9" fill="#bfb6a6"/><circle cx="437" cy="264" r="4" fill="#2a2926"/>
  <g stroke="#bfb6a6" stroke-width="3" stroke-linecap="round"><path d="M402 70v36M472 70v36M402 280v36M472 280v36"/></g>
</svg>
